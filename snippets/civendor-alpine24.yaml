#cloud-config
# Alpine 3.24 (cloud-init qcow2) vendor template — private-network guests
# (public 443 proxied to the guest by the TLS router).
#
# - DNS: this image's cloud-init uses the 'eni' network renderer, which
#   drops the PVE-generated nameserver block (it lands under 'lo' in
#   /etc/network/interfaces, which setup-interfaces ignores), so
#   /etc/resolv.conf is never rendered; the cc_resolv_conf module below
#   writes it in the cloud-config stage, before any runcmd. Nameservers
#   are site-wide.
# - SSH: the account starts LOCKED and the script always sends cipassword;
#   without it OpenSSH refuses publickey auth for it (sshkeys apply once
#   cloud-init sets the password).
# - QGA: not in the image; install it so the PVE 'agent: 1' config works
#   (openrc: add to the default runlevel AND start it this boot).
# - Extra storage: the script's second disk (PVE scsi1) is the one sd* disk
#   with no mounted filesystem and no partition table (device naming is not
#   stable: the root image may be sda or sdb); format it ext4 and mount it
#   at /mnt/storage (fstab entry by UUID; e2fsprogs is not in the base
#   image).
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - 198.60.22.2
    - 1.1.1.3
    - 9.9.9.9
runcmd:
  - apk add --no-cache qemu-guest-agent e2fsprogs
  - rc-update add qemu-guest-agent default
  - rc-service qemu-guest-agent start
  - for b_disk in /dev/sd?; do test -b "$b_disk" || continue; mount | grep -q "^$b_disk " && continue; ls "$b_disk"[0-9] >/dev/null 2>&1 && continue; b_extra="$b_disk"; break; done
  - if test -n "$b_extra"; then mkfs.ext4 "$b_extra"; fi
  - if test -n "$b_extra"; then b_extra_uuid=$(tune2fs -l "$b_extra" | sed -n 's/^Filesystem UUID:[[:space:]]*//p'); fi
  - if test -n "$b_extra_uuid"; then printf 'UUID=%s /mnt/storage ext4 defaults 0 2\n' "$b_extra_uuid" >> /etc/fstab; fi
  - mkdir -p /mnt/storage && mount /mnt/storage
