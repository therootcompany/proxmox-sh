#cloud-config
# Debian 13 (genericcloud) vendor template — private-network guests
# (public 443 proxied to the guest by the TLS router).
#
# The image needs almost nothing:
# - DNS: rendered natively from cloud-init (systemd-resolved stub with the
#   PVE-provided nameservers and search domain) — unlike the alpine
#   eni-renderer images, no resolv_conf fix is needed.
# - SSH: keys-only works out of the box; the image steers root to the
#   'debian' user (forced command in root's key), which has sudo-nopass.
# - QGA: NOT in the image; install it so the PVE 'agent: 1' config works.
#   runcmd runs mid-boot, so the service must be STARTED, not just enabled
#   ('enable' alone leaves it inactive until the next boot).
# - Extra storage: the script's second disk (PVE scsi1) is the one sd* disk
#   with no mounted filesystem and no partition table (device naming is not
#   stable: the root image may be sda or sdb); format it ext4 and mount it
#   at /mnt/storage (fstab entry by UUID).
runcmd:
  - DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends qemu-guest-agent e2fsprogs
  - systemctl enable --now qemu-guest-agent
  - for b_disk in /dev/sd?; do test -b "$b_disk" || continue; mount | grep -q "^$b_disk " && continue; ls "$b_disk"[0-9] >/dev/null 2>&1 && continue; b_extra="$b_disk"; break; done
  - if test -n "$b_extra"; then mkfs.ext4 "$b_extra"; fi
  - if test -n "$b_extra"; then b_extra_uuid=$(tune2fs -l "$b_extra" | sed -n 's/^Filesystem UUID:[[:space:]]*//p'); fi
  - if test -n "$b_extra_uuid"; then printf 'UUID=%s /mnt/storage ext4 defaults 0 2\n' "$b_extra_uuid" >> /etc/fstab; fi
  - mkdir -p /mnt/storage && mount /mnt/storage
